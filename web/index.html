<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="flutter-web-renderer" content="html">
  <link rel="preconnect" href="https://vgzdpbwcenckmjtgfvfw.supabase.co">

  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.png?v=2" type="image/x-icon">

  <link rel="manifest" href="manifest.json">

  <script>
    (function() {
      const isAdmin = new URLSearchParams(window.location.search).has('admin');
      if (isAdmin) {
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = '#141414';
        document.head.appendChild(meta);

        document.title = 'Bonum — Админ';
      } else {
        document.title = 'Bonum — Cafe';
      }
    })();
  </script>

  <style>
    body { background-color: #141414; margin: 0; padding: 0; overflow: hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    window.scanQrCode = function(callback) {
      var overlay = document.createElement('div');
      overlay.id = 'qr-scanner-overlay';
      overlay.style = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        opacity: 0;
        transition: opacity 0.3s ease;
      `;

      overlay.innerHTML = `
        <div style="position: relative; width: 280px; height: 280px; border-radius: 32px; overflow: hidden; border: 2px solid rgba(212, 160, 67, 0.5); box-shadow: 0 0 40px rgba(0,0,0,0.8); background: black;">
          <video id="qr-video" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
          <div id="qr-laser" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, #D4A043, transparent);
            box-shadow: 0 0 12px #D4A043;
            animation: scan 2s linear infinite;
          "></div>
          <div style="position: absolute; top: 20px; left: 20px; width: 24px; height: 24px; border-top: 4px solid #D4A043; border-left: 4px solid #D4A043; border-top-left-radius: 4px;"></div>
          <div style="position: absolute; top: 20px; right: 20px; width: 24px; height: 24px; border-top: 4px solid #D4A043; border-right: 4px solid #D4A043; border-top-right-radius: 4px;"></div>
          <div style="position: absolute; bottom: 20px; left: 20px; width: 24px; height: 24px; border-bottom: 4px solid #D4A043; border-left: 4px solid #D4A043; border-bottom-left-radius: 4px;"></div>
          <div style="position: absolute; bottom: 20px; right: 20px; width: 24px; height: 24px; border-bottom: 4px solid #D4A043; border-right: 4px solid #D4A043; border-bottom-right-radius: 4px;"></div>
        </div>

        <h3 style="margin-top: 24px; font-weight: 900; letter-spacing: 2px; color: white; text-align: center; font-size: 18px;">ПОДТВЕРЖДЕНИЕ СТОЛА</h3>
        <p style="margin-top: 6px; color: rgba(255,255,255,0.7); text-align: center; font-size: 13px; max-width: 280px; line-height: 1.4; font-weight: 500;">
          Наведите камеру на QR-код стола или сделайте снимок
        </p>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <label style="
            background: #D4A043;
            color: black;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
          ">
            📷 СНЯТЬ ФОТО QR
            <input type="file" id="qr-file-input" accept="image/*" capture="environment" style="display: none;">
          </label>

          <button id="qr-close-btn" style="
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            outline: none;
          ">ЗАКРЫТЬ</button>
        </div>
      `;

      var style = document.createElement('style');
      style.innerHTML = `
        @keyframes scan {
          0% { top: 0%; }
          50% { top: 100%; }
          100% { top: 0%; }
        }
        #qr-close-btn:active {
          background: rgba(255,255,255,0.2);
          transform: scale(0.96);
        }
      `;
      document.head.appendChild(style);
      document.body.appendChild(overlay);

      setTimeout(function() { overlay.style.opacity = '1'; }, 50);

      var video = document.getElementById('qr-video');
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.setAttribute('muted', 'true');
      video.playsInline = true;
      video.muted = true;
      video.autoplay = true;

      var stream = null;
      var animationFrameId = null;

      var constraintsList = [
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];

      function tryStartCamera(index) {
        if (index >= constraintsList.length) {
          console.warn("Live stream could not be started. Using photo mode.");
          return;
        }

        navigator.mediaDevices.getUserMedia(constraintsList[index])
          .then(function(s) {
            stream = s;
            video.srcObject = stream;
            var playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(function() {
                animationFrameId = requestAnimationFrame(tick);
              }).catch(function(e) {
                console.warn("Video play error:", e);
                animationFrameId = requestAnimationFrame(tick);
              });
            } else {
              animationFrameId = requestAnimationFrame(tick);
            }
          })
          .catch(function(err) {
            console.warn("Camera constraint failed (" + index + "):", err);
            tryStartCamera(index + 1);
          });
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        tryStartCamera(0);
      }

      // Обработка загрузки фото / съемки через нативную камеру iOS
      var fileInput = document.getElementById('qr-file-input');
      if (fileInput) {
        fileInput.addEventListener('change', function(e) {
          var file = e.target.files[0];
          if (!file) return;

          var reader = new FileReader();
          reader.onload = function(event) {
            var img = new Image();
            img.onload = function() {
              var canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              if (typeof jsQR !== 'undefined') {
                var code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
                if (code && code.data) {
                  cleanup(code.data);
                  return;
                }
              }
              alert("QR-код на фото не распознан. Попробуйте сделать более четкий снимок стола.");
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      document.getElementById('qr-close-btn').addEventListener('click', function() {
        cleanup(null);
      });

      function tick() {
        if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
          var canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          if (typeof jsQR !== 'undefined') {
            var code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert",
            });

            if (code && code.data) {
              cleanup(code.data);
              return;
            }
          }
        }
        animationFrameId = requestAnimationFrame(tick);
      }

      function cleanup(result) {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (stream) {
          stream.getTracks().forEach(function(track) { track.stop(); });
        }
        overlay.style.opacity = '0';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          if (style.parentNode) style.parentNode.removeChild(style);
          callback(result);
        }, 300);
      }
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
