<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="flutter-web-renderer" content="html">
  <link rel="preconnect" href="https://vgzdpbwcenckmjtgfvfw.supabase.co">

  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" href="favicon.png?v=2" type="image/x-icon">

  <link rel="manifest" href="manifest.json">

  <script>
    (function() {
      const isAdmin = new URLSearchParams(window.location.search).has('admin');
      if (isAdmin) {
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = '#141414';
        document.head.appendChild(meta);

        document.title = 'Bonum — Админ';
      } else {
        document.title = 'Bonum — Cafe';
      }
    })();
  </script>

  <style>
    body { background-color: #141414; margin: 0; padding: 0; overflow: hidden; }
    
    #bonum-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash-logo {
      font-family: 'Forum', serif, -apple-system, sans-serif;
      color: #FFFFFF;
      font-size: 34px;
      letter-spacing: 8px;
      margin-left: 8px;
      font-weight: 400;
    }
    .splash-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: rgba(255, 255, 255, 0.38);
      font-size: 11px;
      letter-spacing: 6px;
      margin-left: 6px;
      margin-top: 4px;
      font-weight: 600;
    }
    .splash-bar {
      width: 130px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 28px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #D4A043;
      border-radius: 2px;
      box-shadow: 0 0 10px #D4A043;
      animation: splashPulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes splashPulse {
      0% { left: 0%; width: 25%; }
      100% { left: 75%; width: 35%; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <script>
    window.scanQrCode = function(callback) {
      var overlay = document.createElement('div');
      overlay.id = 'qr-scanner-overlay';
      overlay.style = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        opacity: 0;
        transition: opacity 0.3s ease;
      `;

      overlay.innerHTML = `
        <button id="qr-close-top" style="
          position: absolute;
          top: 24px;
          right: 24px;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: rgba(255,255,255,0.15);
          border: 1px solid rgba(255,255,255,0.25);
          color: white;
          font-size: 22px;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          z-index: 10;
          outline: none;
          backdrop-filter: blur(5px);
        ">✕</button>

        <div style="position: relative; width: 280px; height: 280px; border-radius: 32px; overflow: hidden; border: 2px solid rgba(212, 160, 67, 0.5); box-shadow: 0 0 40px rgba(0,0,0,0.8); background: black;">
          <video id="qr-video" autoplay playsinline webkit-playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
          <div id="qr-laser" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, transparent, #D4A043, transparent);
            box-shadow: 0 0 12px #D4A043;
            animation: scan 2s linear infinite;
          "></div>
          <div style="position: absolute; top: 20px; left: 20px; width: 24px; height: 24px; border-top: 4px solid #D4A043; border-left: 4px solid #D4A043; border-top-left-radius: 4px;"></div>
          <div style="position: absolute; top: 20px; right: 20px; width: 24px; height: 24px; border-top: 4px solid #D4A043; border-right: 4px solid #D4A043; border-top-right-radius: 4px;"></div>
          <div style="position: absolute; bottom: 20px; left: 20px; width: 24px; height: 24px; border-bottom: 4px solid #D4A043; border-left: 4px solid #D4A043; border-bottom-left-radius: 4px;"></div>
          <div style="position: absolute; bottom: 20px; right: 20px; width: 24px; height: 24px; border-bottom: 4px solid #D4A043; border-right: 4px solid #D4A043; border-bottom-right-radius: 4px;"></div>
        </div>

        <h3 style="margin-top: 24px; font-weight: 900; letter-spacing: 2px; color: white; text-align: center; font-size: 18px;">ПОДТВЕРЖДЕНИЕ СТОЛА</h3>
        <p style="margin-top: 6px; color: rgba(255,255,255,0.7); text-align: center; font-size: 13px; max-width: 280px; line-height: 1.4; font-weight: 500;">
          Наведите камеру на QR-код вашего стола
        </p>
        <div id="qr-camera-error" style="display: none; color: #FF5252; margin-top: 10px; font-size: 12px; text-align: center; max-width: 260px; font-weight: 600;">
          Камера недоступна. Пожалуйста, разрешите доступ к камере в браузере.
        </div>

        <div style="margin-top: 24px;">
          <button id="qr-close-btn" style="
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 12px 32px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            outline: none;
            transition: background 0.2s ease, transform 0.1s ease;
          ">ОТМЕНА</button>
        </div>
      `;

      var style = document.createElement('style');
      style.innerHTML = `
        @keyframes scan {
          0% { top: 0%; }
          50% { top: 100%; }
          100% { top: 0%; }
        }
        #qr-close-btn:active, #qr-close-top:active {
          background: rgba(255,255,255,0.3);
          transform: scale(0.96);
        }
      `;
      document.head.appendChild(style);
      document.body.appendChild(overlay);

      setTimeout(function() { overlay.style.opacity = '1'; }, 50);

      var openedAt = Date.now();
      function safeClose(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        // Защита от случайного фантомного клика в первые 600 мс после открытия
        if (Date.now() - openedAt < 600) {
          return;
        }
        cleanup(null);
      }

      var closeBtn = document.getElementById('qr-close-btn');
      if (closeBtn) closeBtn.addEventListener('click', safeClose);

      var closeTopBtn = document.getElementById('qr-close-top');
      if (closeTopBtn) closeTopBtn.addEventListener('click', safeClose);

      var video = document.getElementById('qr-video');
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.setAttribute('muted', 'true');
      video.playsInline = true;
      video.muted = true;
      video.autoplay = true;

      var stream = null;
      var animationFrameId = null;

      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });

      var constraintsList = [
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];

      function tryStartCamera(index) {
        if (index >= constraintsList.length) {
          console.warn("Live stream could not be started.");
          var errDiv = document.getElementById('qr-camera-error');
          if (errDiv) errDiv.style.display = 'block';
          return;
        }

        navigator.mediaDevices.getUserMedia(constraintsList[index])
          .then(function(s) {
            stream = s;
            video.srcObject = stream;
            
            var startStream = function() {
              video.play().then(function() {
                if (!animationFrameId) animationFrameId = requestAnimationFrame(tick);
              }).catch(function(e) {
                console.warn("Video play error:", e);
                if (!animationFrameId) animationFrameId = requestAnimationFrame(tick);
              });
            };

            if (video.readyState >= 1) {
              startStream();
            } else {
              video.onloadedmetadata = startStream;
            }
          })
          .catch(function(err) {
            console.warn("Camera constraint failed (" + index + "):", err);
            tryStartCamera(index + 1);
          });
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        tryStartCamera(0);
      } else {
        var errDiv = document.getElementById('qr-camera-error');
        if (errDiv) errDiv.style.display = 'block';
      }

      var lastScanTime = 0;
      function tick(now) {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          // Сканируем каждые 100 мс, чтобы не нагружать процессор смартфона
          if (!now || (now - lastScanTime > 100)) {
            lastScanTime = now || Date.now();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (typeof jsQR !== 'undefined') {
              var code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
              });

              if (code && code.data && code.data.trim().length > 0) {
                cleanup(code.data.trim());
                return;
              }
            }
          }
        }
        animationFrameId = requestAnimationFrame(tick);
      }

      function cleanup(result) {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (stream) {
          stream.getTracks().forEach(function(track) { track.stop(); });
        }
        overlay.style.opacity = '0';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          if (style.parentNode) style.parentNode.removeChild(style);
          callback(result);
        }, 300);
      }
    }
  </script>
</head>
<body>
  <div id="bonum-splash">
    <div class="splash-logo">BONUM</div>
    <div class="splash-sub">CAFE</div>
    <div class="splash-bar"><div class="splash-progress"></div></div>
  </div>

  <script>
    (function() {
      function removeSplash() {
        var splash = document.getElementById('bonum-splash');
        if (splash && splash.style.opacity !== '0') {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
      }
      window.addEventListener('flutter-first-frame', removeSplash);
      // Страховочный таймер (на случай если событие первого кадра задержится)
      setTimeout(removeSplash, 4500);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
